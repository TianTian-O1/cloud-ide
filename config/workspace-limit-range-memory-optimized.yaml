apiVersion: v1
kind: LimitRange
metadata:
  name: workspace-limit-range
  namespace: cloud-ide-ws
spec:
  limits:
  - type: Pod
    max:
      cpu: "8"
      memory: 16Gi
    min:
      cpu: 50m
      memory: 256Mi
  - type: Container
    default:
      cpu: "1"
      memory: 2Gi
    defaultRequest:
      cpu: 100m
      memory: 256Mi
    max:
      cpu: "4"
      memory: 4Gi
    min:
      cpu: 50m
      memory: 256Mi
  - type: PersistentVolumeClaim
    max:
      storage: 100Gi
    min:
      storage: 1Gi
