apiVersion: v1
kind: LimitRange
metadata:
  name: workspace-limit-range
  namespace: cloud-ide-ws
spec:
  limits:
  - type: Pod
    min:
      cpu: 50m
      memory: 128Mi
    max:
      cpu: 8
      memory: 16Gi
  - type: Container
    min:
      cpu: 50m
      memory: 128Mi
    max:
      cpu: 4
      memory: 8Gi
    default:
      cpu: 1            # 限制保持1核
      memory: 1Gi       # 限制保持1GB
    defaultRequest:
      cpu: 100m         # 请求从500m降至100m (5倍提升)
      memory: 256Mi     # 请求从512Mi降至256Mi (2倍提升)
  - type: PersistentVolumeClaim
    min:
      storage: 1Gi
    max:
      storage: 100Gi