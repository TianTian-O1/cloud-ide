apiVersion: batch/v1
kind: CronJob
metadata:
  name: inactive-workspace-cleanup
  namespace: cloud-ide
spec:
  schedule: "0 3 * * *"  # 每天凌晨3点执行
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: storage-manager
          restartPolicy: OnFailure
          containers:
          - name: cleanup
            image: bitnami/kubectl:latest
            command:
            - /bin/bash
            - -c
            - |
              #!/bin/bash
              echo "Starting inactive workspace cleanup..."
              
              NAMESPACE="cloud-ide-ws"
              MYSQL_POD=$(kubectl get pods -n cloud-ide -l app=mysql --no-headers -o custom-columns=":metadata.name")
              
              if [ -z "$MYSQL_POD" ]; then
                echo "Error: MySQL pod not found"
                exit 1
              fi
              
              echo "Found MySQL pod: $MYSQL_POD"
              
              # 查找1天前未访问的工作空间
              echo "Finding inactive workspaces (not accessed for 1 day)..."
              
              INACTIVE_WORKSPACES=$(kubectl exec -n cloud-ide $MYSQL_POD -- mysql -u root -p123456 cloud_ide -sN -e "
                SELECT sid FROM t_space 
                WHERE status = 1 
                AND last_access_time < DATE_SUB(NOW(), INTERVAL 1 DAY)
                AND last_access_time IS NOT NULL
              " 2>/dev/null)
              
              if [ -z "$INACTIVE_WORKSPACES" ]; then
                echo "No inactive workspaces found"
                exit 0
              fi
              
              echo "Found inactive workspaces:"
              echo "$INACTIVE_WORKSPACES"
              
              # 清理不活跃的工作空间
              for sid in $INACTIVE_WORKSPACES; do
                echo "Processing workspace: $sid"
                
                # 查找对应的WorkSpace资源
                WORKSPACE_NAME=$(kubectl get workspace -n $NAMESPACE --no-headers -o custom-columns=":metadata.name" | grep $sid | head -1)
                
                if [ -n "$WORKSPACE_NAME" ]; then
                  echo "Deleting workspace: $WORKSPACE_NAME"
                  kubectl delete workspace $WORKSPACE_NAME -n $NAMESPACE --timeout=60s
                  
                  # 等待资源清理
                  sleep 5
                  
                  # 检查Pod是否还存在
                  POD_NAME=$(kubectl get pods -n $NAMESPACE --no-headers -o custom-columns=":metadata.name" | grep $sid | head -1)
                  if [ -n "$POD_NAME" ]; then
                    echo "Force deleting pod: $POD_NAME"
                    kubectl delete pod $POD_NAME -n $NAMESPACE --force --grace-period=0
                  fi
                  
                  # 更新数据库状态为已删除
                  kubectl exec -n cloud-ide $MYSQL_POD -- mysql -u root -p123456 cloud_ide -e "
                    UPDATE t_space SET status = 0, delete_time = NOW() WHERE sid = '$sid'
                  " 2>/dev/null
                  
                  echo "Workspace $sid cleaned up successfully"
                else
                  echo "No Kubernetes workspace found for sid: $sid, updating database only"
                  kubectl exec -n cloud-ide $MYSQL_POD -- mysql -u root -p123456 cloud_ide -e "
                    UPDATE t_space SET status = 0, delete_time = NOW() WHERE sid = '$sid'
                  " 2>/dev/null
                fi
              done
              
              echo "Inactive workspace cleanup completed"
